<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voltlites Scroll Animation </title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="logo">
      <img src="/logo.svg" alt="" />
    </div>

    <section class="hero">
      <div class="hero-inner">
        <div class="hero-spotlight-gallery">
          <div class="hero-spotlight-col">
            <div class="hero-spotlight-item">
              <img src="/img1.jpg" alt="" />
            </div>
            <div class="hero-spotlight-item">
              <img src="/img2.jpg" alt="" />
            </div>
            <div class="hero-spotlight-item">
              <img src="/img3.jpg" alt="" />
            </div>
          </div>
          <div class="hero-spotlight-col">
            <div class="hero-spotlight-item">
              <img src="/img4.jpg" alt="" />
            </div>
            <div class="hero-spotlight-item">
              <img src="/img5.jpg" alt="" />
            </div>
            <div class="hero-spotlight-item">
              <img src="/img6.jpg" alt="" />
            </div>
          </div>
          <div class="hero-spotlight-col">
            <div class="hero-spotlight-item">
              <img src="/img7.jpg" alt="" />
            </div>
            <div class="hero-spotlight-item">
              <img src="/img8.jpg" alt="" />
            </div>
            <div class="hero-spotlight-item">
              <img src="/img9.jpg" alt="" />
            </div>
          </div>
        </div>

        <div class="hero-header">
          <h3>
            A living catalogue of images that shouldn't exist, collected frame
            by frame from the edge of the real.
          </h3>

          <a href="#" class="btn">Request Access</a>
        </div>

        <div class="hero-footer">
          <h5>An archive of the unreal</h5>
        </div>
      </div>
      <div class="hero-overlay"></div>
    </section>

    <section class="studio">
      <h1>Studio</h1>
    </section>

    <section class="connect">
      <h1>Connect</h1>
    </section>
    <script type="module" src="/script.js"></script>
  </body>
</html>
